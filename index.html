<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="RAIA">
<meta name="theme-color" content="#1E5631">
<meta name="apple-mobile-web-app-title" content="RAIA Chauffeur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="RAIA Chauffeur – relevés de compteur, carburant et pannes – HOSHI BTP">
<title>RAIA Chauffeur</title>
<style>
:root{
  --vert:#1E5631; --vert2:#2E7D32; --vert-l:#E8F5E9; --vert-xl:#F4FAF4;
  --rouge:#C62828; --rouge-l:#FDECEA; --orange:#E65100; --orange-l:#FFF3E0; --bleu:#1E3A8A; --bleu-l:#DBEAFE;
  --gris:#6B7280; --gris-l:#F3F4F6; --ligne:#E5E7EB; --encre:#1F2937; --fond:#F7F8F7; --blanc:#FFFFFF;
  --rayon:10px; --ombre:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--encre);background:var(--fond);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--vert2)}
.cache{display:none!important}

/* Connexion */
.ecran-cnx{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#1E5631 0%,#2E7D32 55%,#4C9A50 100%)}
.carte-cnx{background:var(--blanc);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:36px 32px;width:100%;max-width:400px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-mark{width:46px;height:46px;border-radius:12px;background:var(--vert);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;letter-spacing:.5px}
.logo-txt b{display:block;font-size:24px;letter-spacing:3px;color:var(--vert)}
.logo-txt span{font-size:12px;color:var(--gris)}
.carte-cnx h2{font-size:15px;font-weight:600;margin:22px 0 14px;color:var(--gris)}
.champ{margin-bottom:14px}
.champ label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
.champ input,.champ select,.champ textarea{width:100%;padding:10px 12px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--vert2);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.champ input[disabled],.champ textarea[disabled],.champ select[disabled]{background:var(--gris-l);color:#4B5563}
.champ .aide{font-size:11px;color:var(--gris);margin-top:4px}
.req::after{content:" *";color:var(--rouge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--gris-l);transition:filter .15s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.55;cursor:default}
.btn-p{background:var(--vert);color:#fff}
.btn-r{background:var(--rouge);color:#fff}
.btn-c{background:#fff;border-color:#D1D5DB}
.btn-s{padding:6px 10px;font-size:13px}
.btn-bloc{width:100%;padding:12px}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg-e{background:var(--rouge-l);color:var(--rouge)}
.msg-i{background:var(--vert-l);color:var(--vert)}
.pied-cnx{margin-top:18px;font-size:11px;color:var(--gris);text-align:center}

/* Coquille */
.coquille{display:flex;min-height:100%}
.barre{width:236px;background:var(--vert);color:#E8F5E9;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.barre .logo{padding:18px 18px 10px}
.barre .logo-mark{background:#fff;color:var(--vert);width:38px;height:38px;font-size:18px}
.barre .logo-txt b{color:#fff;font-size:20px}
.barre .logo-txt span{color:#A5D6A7}
.nav-groupe{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#A5D6A7;padding:16px 20px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#E8F5E9;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.actif{background:rgba(255,255,255,.13);border-left-color:#fff;color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.barre .bas{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
.barre .bas .nom{font-weight:600;color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-ADMIN{background:#FFE082;color:#5D4037}.b-EDITEUR{background:#C8E6C9;color:#1B5E20}.b-UTILISATEUR{background:#BBDEFB;color:#0D47A1}.b-INVITE{background:#E0E0E0;color:#424242}
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.entete{background:#fff;border-bottom:1px solid var(--ligne);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.entete h1{font-size:18px;margin:0;font-weight:700}
.entete .sous{color:var(--gris);font-size:12px}
.burger{display:none;background:none;border:0;padding:4px;cursor:pointer}
.contenu{padding:20px 24px 40px}

/* Tableau de bord */
.grille-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--rayon);box-shadow:var(--ombre);padding:14px 16px;border-left:4px solid var(--vert2)}
.kpi.r{border-left-color:var(--rouge)}.kpi.o{border-left-color:var(--orange)}
.kpi .l{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi.r .v{color:var(--rouge)}
.kpi .s{font-size:12px;color:var(--gris)}
.bloc{background:#fff;border-radius:var(--rayon);box-shadow:var(--ombre);padding:16px 18px;margin-bottom:16px}
.bloc h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--vert)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.deux>*,.bloc,.contenu{min-width:0}
.tab-wrap{max-width:100%}
.titre-sec{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.titre-sec h2{font-size:15px;margin:0;color:var(--encre)}
.titre-sec .trait{flex:1;height:1px;background:var(--ligne)}
.barres .ln{display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.barres .piste{background:var(--gris-l);border-radius:4px;height:14px;overflow:hidden}
.barres .rempli{height:100%;background:var(--vert2);border-radius:4px}
.barres .rempli.r{background:#E57373}
.barres .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--gris)}
.cols .c i{display:block;width:100%;max-width:44px;background:var(--vert2);border-radius:4px 4px 0 0;min-height:2px}
.cols .c b{font-size:10.5px;color:var(--encre);margin-bottom:3px;font-weight:600;white-space:nowrap}

/* Tables */
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.outils input[type=search],.outils select{padding:8px 10px;border:1px solid #D1D5DB;border-radius:8px;background:#fff}
.outils input[type=search]{min-width:240px;flex:1;max-width:380px}
.outils .esp{flex:1}
tr.grp td{background:var(--vert-l);color:var(--vert);font-weight:700;cursor:pointer}
tr.grp td.n{white-space:nowrap}
table.t tr.err td{background:#FDECEC;color:#B42318}
table.t tr.err:hover td{background:#FBD9D9}
table.t tr.trou td{background:#D92D20;color:#fff;font-weight:700;font-size:12.5px;padding:5px 10px;cursor:default}
.btn-on{background:var(--vert);color:#fff;border-color:var(--vert)}
.compte{font-size:12px;color:var(--gris)}
.tab-wrap{background:#fff;border-radius:var(--rayon);box-shadow:var(--ombre);overflow:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--vert-xl);color:var(--vert);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--ligne);position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
table.t th.n,table.t td.n{text-align:right}
table.t td{padding:8px 10px;border-bottom:1px solid #F0F1F2;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#FAFBFA}
table.t tfoot td{font-weight:700;background:var(--vert-xl);border-top:1px solid var(--ligne)}
.pastille{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.s-retard{background:var(--rouge-l);color:var(--rouge)}.s-proche{background:var(--orange-l);color:var(--orange)}
.s-payee{background:var(--vert-l);color:var(--vert)}.s-annulee{background:var(--gris-l);color:var(--gris);text-decoration:line-through}
.s-attente{background:var(--bleu-l);color:var(--bleu)}
.pagin{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px;font-size:12px;color:var(--gris)}
.vide{padding:40px;text-align:center;color:var(--gris)}

/* Modale */
.voile{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modale{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modale .tete{padding:16px 20px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.modale .tete h3{margin:0;font-size:16px;flex:1}
.modale .corps{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.modale .corps .large{grid-column:1/-1}
.modale .pied{padding:14px 20px;border-top:1px solid var(--ligne);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fermer{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--gris)}
.cases{display:flex;flex-wrap:wrap;gap:8px}
.cases label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;border:1px solid #D1D5DB;border-radius:8px;padding:7px 10px;cursor:pointer}
.ligne-url{display:flex;gap:6px}
.ligne-url input{flex:1}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:var(--ombre)}
.toast.e{background:var(--rouge)}
.chargement{display:flex;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--gris)}
.rond{width:20px;height:20px;border:3px solid #C8E6C9;border-top-color:var(--vert2);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.droits-info{font-size:12px;color:var(--gris);background:var(--gris-l);padding:6px 10px;border-radius:6px}

.onglets{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.onglets button{border:1px solid var(--ligne);background:#fff;padding:7px 14px;border-radius:99px;font-weight:600;cursor:pointer;font-size:13px;color:var(--encre);font-family:inherit}
.onglets button.actif{background:var(--vert);color:#fff;border-color:var(--vert)}
.onglets.petits button{padding:5px 11px;font-size:12px}
.champ-mini{padding:5px 8px;border-radius:6px;border:1px solid #D1D5DB;font:inherit;font-size:12.5px;background:#fff}
.n-e{color:var(--rouge);font-weight:700}.n-a{color:var(--orange);font-weight:700}.n-ok{color:var(--vert2);font-weight:700}
table.tl tbody tr,table.t tr.tl{cursor:default}
.piste-mini{background:var(--gris-l);border-radius:4px;height:10px;overflow:visible}
.piste-mini>div{height:100%;background:var(--vert2);border-radius:4px}.piste-mini>div.r{background:#E57373}
.piste-mini .repere{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--encre)}
.obj{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.obj b{display:block;font-size:20px;margin-top:2px}
.ctrl{border-bottom:1px solid #F0F1F2}.ctrl:last-child{border-bottom:0}
.ctrl-t{display:grid;grid-template-columns:22px 1fr 70px;gap:8px;align-items:center;padding:10px 4px;cursor:pointer;font-size:13px}
.ctrl-t .act{font-size:12px;color:var(--gris);margin-top:2px}
.ctrl-d{display:none;padding:0 0 10px 26px;max-height:360px;overflow:auto}.ctrl.ouvert .ctrl-d{display:block}
.ctrl-i{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}.ctrl-i:hover{background:var(--vert-xl)}
.ctrl-i>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn-envoi{padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.btn-envoi svg,#eAuto svg{width:14px;height:14px}
#eAuto{display:inline-flex;align-items:center;gap:6px}
.mdp{background:var(--vert-xl);color:var(--vert);padding:5px 10px;border-radius:6px;font-size:14px;font-weight:700;letter-spacing:.5px}
.pied.envoi{flex-wrap:wrap}
.ch{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.ch-tete{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.ch-tete b{display:block;font-size:17px;color:var(--vert)}.ch-tete span{font-size:12.5px;color:var(--gris)}
.ch-carte{background:#fff;border-radius:14px;box-shadow:var(--ombre);padding:16px;display:flex;flex-direction:column;gap:6px}
.ch-carte label{font-size:13px;font-weight:700;color:var(--encre);margin-top:6px}
.ch-carte input,.ch-carte select,.ch-carte textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;width:100%;box-sizing:border-box}
.ch-btn{margin-top:12px;background:var(--vert);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer}
.ch-btn:disabled{opacity:.6}
.ch-photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed #A5D6A7;background:var(--vert-xl);border-radius:12px;padding:18px;cursor:pointer;font-weight:700!important;color:var(--vert)!important;font-size:15px!important;text-align:center}
.ch-photo.petit{padding:12px;font-size:13.5px!important}
.ch-photo img{max-width:100%;max-height:260px;border-radius:8px}
.ch-deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ch-deux>div{display:flex;flex-direction:column;gap:6px}
.ch-panne{display:flex!important;align-items:center;gap:8px;color:var(--rouge)!important}.ch-panne input{width:20px!important;height:20px}
.ch-info{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ch-info>div{flex:1;min-width:140px;background:#fff;border-radius:12px;box-shadow:var(--ombre);padding:10px 12px}
.ch-info span{display:block;font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.3px}.ch-info b{font-size:14px}
.ch-hist{margin-top:14px;background:#fff;border-radius:12px;box-shadow:var(--ombre);padding:12px 14px;font-size:13.5px}
.ch-hist>div{display:grid;grid-template-columns:1fr 1.2fr 60px;padding:6px 0;border-bottom:1px solid #F0F1F2}.ch-hist>div>span:nth-child(2),.ch-hist>div>span:nth-child(3){text-align:right}.ch-hist>div:last-child{border-bottom:0}
.ch-pied{text-align:center;margin-top:16px}.ch-pied a{color:var(--gris);font-size:13px}
.ch-ok{font-size:14.5px;font-weight:600}
.ch-file{margin-bottom:12px;background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:10px 12px;font-size:13.5px}
.ch-file.ok{background:var(--vert-xl);border-color:#A5D6A7}
.ch-file b{display:block;margin-bottom:4px}.ch-file .it{padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}.ch-file .it:first-of-type{border-top:0}
.ch-file .it button{margin:4px 6px 0 0;padding:6px 10px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;font:inherit;font-size:13px}
.ch-file .it button.p{background:var(--vert);color:#fff;border-color:var(--vert)}
.ch-hist .att{color:#B26A00}
.ch-file .t b{display:inline;margin:0}
.ch-galerie{display:block;text-align:center;font-size:13px!important;font-weight:600!important;color:var(--vert2)!important;text-decoration:underline;cursor:pointer;margin:2px 0 4px}
#hl{position:fixed;top:0;left:0;right:0;z-index:999;background:#FFF3CD;color:#7A5200;border-bottom:1px solid #FFE08A;padding:7px 14px;font-size:13px;text-align:center}
body.hors-ligne .principal{padding-top:34px}
.rond-mini{display:inline-block;width:12px;height:12px;border:2px solid var(--vert-l);border-top-color:var(--vert);border-radius:50%;animation:t 1s linear infinite;vertical-align:-2px;margin-right:4px}
@media (max-width:860px){.obj{grid-template-columns:1fr 1fr 1fr}.obj b{font-size:16px}.ctrl-i{flex-direction:column;gap:2px}}
@media (max-width:860px){
  .barre{position:fixed;left:-260px;z-index:40;transition:left .2s;height:100%}
  .barre.ouverte{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .burger{display:block}
  .deux{grid-template-columns:1fr}
  .contenu{padding:14px}
  .modale .corps{grid-template-columns:1fr}
  .outils input[type=search]{min-width:0;max-width:none;width:100%}
  .barres .ln{grid-template-columns:80px 1fr 96px}
}
</style>
</head>

/* ---------- utilitaires ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var NF = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
var NF2 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
function fcfa(v) { return (v === '' || v == null || isNaN(v)) ? '' : NF.format(Math.round(Number(v))) + ' F'; }
function nb(v) { return (v === '' || v == null || isNaN(v)) ? '' : NF2.format(Number(v)); }
function pct(v) { return (v == null || isNaN(v)) ? '' : (Number(v) * 100).toFixed(1).replace('.', ',') + ' %'; }
function dfr(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : (v || ''); }
function mFr(k) { var M = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']; var p = k.split('-'); return M[Number(p[1]) - 1] + ' ' + p[0].slice(2); }
/* Règle HOSHI BTP : un relevé pris le matin (avant 12 h) est le relevé de la veille. */
function jourReleve(base) { var b = base || auj(); if (new Date().getHours() >= 12) return b; var d = new Date(b + 'T12:00:00'); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function auj() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function toast(msg, err) { var t = document.createElement('div'); t.className = 'toast' + (err ? ' e' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 5000 : 2600); }
function stocker(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { } }
function lire(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

/* ---------- stockage local (IndexedDB, repli localStorage) ---------- */
var LOC = (function () {
  var dbp = null, mem = {};
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (ok) {
      try {
        var r = indexedDB.open('raia', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { ok(r.result); };
        r.onerror = function () { ok(null); };
      } catch (e) { ok(null); }
    });
    return dbp;
  }
  function tx(mode, f) {
    return db().then(function (d) {
      if (!d) return null;
      return new Promise(function (ok) {
        try { var t = d.transaction('kv', mode), st = t.objectStore('kv'), r = f(st); t.oncomplete = function () { ok(r && 'result' in r ? r.result : null); }; t.onerror = t.onabort = function () { ok(null); }; }
        catch (e) { ok(null); }
      });
    });
  }
  return {
    get: function (k) {
      return tx('readonly', function (st) { return st.get(k); }).then(function (v) {
        if (v != null) return v;
        try { var x = localStorage.getItem('raia_kv_' + k); if (x) return JSON.parse(x); } catch (e) { }
        return mem[k] == null ? null : mem[k];
      });
    },
    set: function (k, v) {
      mem[k] = v;
      return db().then(function (d) {
        if (d) return tx('readwrite', function (st) { return st.put(v, k); });
        try { localStorage.setItem('raia_kv_' + k, JSON.stringify(v)); } catch (e) { }
      });
    },
    del: function (k) { delete mem[k]; try { localStorage.removeItem('raia_kv_' + k); } catch (e) { } return tx('readwrite', function (st) { return st.delete(k); }); },
    viderPrefixe: function (pre) {
      Object.keys(mem).forEach(function (k) { if (k.indexOf(pre) === 0) delete mem[k]; });
      return tx('readwrite', function (st) {
        var r = st.openCursor();
        r.onsuccess = function () { var c = r.result; if (!c) return; if (String(c.key).indexOf(pre) === 0) c.delete(); c.continue(); };
        return r;
      });
    }
  };
})();
function hhmm(ts) { var d = new Date(ts); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' à ' + String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0'); }

/* ---------- mode hors ligne (bureau) : consultation de la dernière copie ---------- */
function cleHL(action, params) { return 'b:' + (S.user ? S.user.identifiant : lire('raia_u') || '?') + ':' + action + ':' + JSON.stringify(params || {}); }
function bandeauHL(le) {
  var b = document.getElementById('hl');
  if (!le) { if (b) b.remove(); document.body.classList.remove('hors-ligne'); S.horsLigne = null; return; }
  S.horsLigne = le;
  if (!b) { b = document.createElement('div'); b.id = 'hl'; document.body.appendChild(b); }
  document.body.classList.add('hors-ligne');
  b.textContent = '📶 Hors connexion – vous consultez les données du ' + hhmm(le) + '. Les modifications reprendront dès le retour du réseau.';
}
window.addEventListener('online', function () {
  if (MODE === 'chauffeur') return;
  if (S.horsLigne && S.token && S.ctx) { bandeauHL(null); afficherVue(); }
});

var LECTURES = { tableauDeBord: 1, lister: 1, utilisateurs: 1, journal: 1, parametres: 1 };
function appel(action, params) {
  var ecran = S.ecran;
  return new Promise(function (ok, ko) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (LECTURES[action] && ecran !== S.ecran) return; /* réponse d'un écran quitté entre-temps : ignorée */
        if (r && r.ok) {
          if (S.horsLigne) bandeauHL(null);
          if (LECTURES[action]) LOC.set(cleHL(action, params), { le: Date.now(), data: r.data });
          return ok(r.data);
        }
        var err = new Error((r && r.message) || 'Erreur inconnue'); err.code = r && r.erreur;
        if (err.code === 'SESSION') { finSession(err.message); }
        else if (err.code === 'MDP') { ecranMotDePasse(true); }
        ko(err);
      })
      .withFailureHandler(function (e) {
        if (LECTURES[action] && ecran !== S.ecran) return;
        var reseau = new Error('Connexion au serveur impossible : ' + (e && e.message ? e.message : e));
        if (!LECTURES[action]) return ko(navigator.onLine === false ? new Error('Hors connexion : enregistrement impossible pour le moment. Réessayez dès le retour du réseau.') : reseau);
        LOC.get(cleHL(action, params)).then(function (c) {
          if (ecran !== S.ecran) return;
          if (!c) return ko(new Error('Hors connexion, et cet écran n\'a pas encore été ouvert sur cet ordinateur : aucune copie disponible.'));
          bandeauHL(c.le); ok(c.data);
        });
      })
      .api(S.token, action, params || {});
  });
}

    '<div class="champ"><label for="cId">Identifiant</label><input id="cId" name="username" autocomplete="username" required autofocus></div>' +
    '<div class="champ"><label for="cMdp">Mot de passe</label><input id="cMdp" name="password" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn btn-p btn-bloc" id="bCnx" type="submit">Se connecter</button>' +
    '<div class="pied-cnx">Accès réservé au personnel de HOSHI BTP.<br>Mot de passe oublié : contactez l\'administrateur.</div>' +
    '</form></div>';
  $('#fCnx').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = $('#bCnx'); b.disabled = true; b.textContent = 'Connexion…';
    google.script.run.withSuccessHandler(function (r) {
      if (!r.ok) { ecranConnexion(r.message); return; }
      S.token = r.data.token; S.user = r.data.utilisateur; stocker('raia_t', S.token); stocker('raia_u', S.user.identifiant);
      if (r.data.contexte) LOC.set(cleHL('contexte', {}), { le: Date.now(), data: r.data.contexte });
      if (S.user.doit_changer) return ecranMotDePasse(true);
      S.ctx = r.data.contexte; S.vue = 'tdb'; coquille();
    }).withFailureHandler(function (er) { ecranConnexion('Serveur injoignable : ' + er.message); })
      .api(null, 'connexion', { identifiant: $('#cId').value, motdepasse: $('#cMdp').value });
  });
}

function finSession(msg) { LOC.viderPrefixe('b:'); bandeauHL(null); stocker('raia_u', null); S.token = null; S.user = null; S.ctx = null; S.cache = {}; stocker('raia_t', null); ecranConnexion(msg || 'Vous êtes déconnecté.', 'i'); }

function deconnexion() { appel('deconnexion').catch(function () { }).then(function () { finSession('Vous êtes déconnecté.'); }); }

function ecranMotDePasse(force) {
  var html = '<form id="fMdp">' +
    (force ? '<div class="msg msg-i">Première connexion ou mot de passe réinitialisé : choisissez votre mot de passe personnel.</div>' : '') +
    '<div class="champ"><label class="req">Mot de passe actuel</label><input type="password" id="mA" autocomplete="current-password" required></div>' +

    '<div class="champ"><label class="req">Confirmer le nouveau mot de passe</label><input type="password" id="mC" autocomplete="new-password" required></div>' +
    '<div id="mErr"></div><button class="btn btn-p btn-bloc" type="submit">Enregistrer le mot de passe</button></form>';
  if (force) {
    $('#app').innerHTML = '<div class="ecran-cnx"><div class="carte-cnx"><div class="logo"><div class="logo-mark">R</div><div class="logo-txt"><b>RAIA</b><span>' + esc(S.user ? S.user.nom : '') + '</span></div></div><h2>Changer votre mot de passe</h2>' + html +
      '<div class="pied-cnx"><a href="#" id="lOut">Se déconnecter</a></div></div></div>';
    $('#lOut').onclick = function (e) { e.preventDefault(); deconnexion(); };
  } else {
    entete('Mon compte', 'Changer mon mot de passe');
    $('#contenu').innerHTML = '<div class="bloc" style="max-width:460px">' + html + '</div>';
  }
  $('#fMdp').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('#mN').value !== $('#mC').value) { $('#mErr').innerHTML = '<div class="msg msg-e">Les deux nouveaux mots de passe ne correspondent pas.</div>'; return; }
    appel('changerMotDePasse', { ancien: $('#mA').value, nouveau: $('#mN').value }).then(function (d) {
      S.user = d.utilisateur; S.ctx = d.contexte; toast('Mot de passe modifié'); S.vue = 'tdb'; coquille();
    }).catch(function (er) { if ($('#mErr')) $('#mErr').innerHTML = '<div class="msg msg-e">' + esc(er.message) + '</div>'; });
  });
}

function afficherVue() {
  var v = S.vue;

  if (v === 'pilotage' && S.ctx.admin) return vuePilotage();
  if (v === 'compte') return ecranMotDePasse(false);
  if (v === 'installer') return vueInstaller();
  if (v === 'excel') return vueExcel();
  if (v === 'utilisateurs') return vueUtilisateurs();
  if (v === 'journal') return vueJournal();
  if (v === 'parametres') return vueParametres();
  if (S.ctx.tables[v]) return vueTable(v);

/* ---------- tableau de bord ---------- */
function vueTableauDeBord() {
  var u = S.ctx.utilisateur;
  entete('Tableau de bord', 'Bonjour ' + u.nom + ' · situation au ' + dfr(auj()));
  chargement();
  appel('tableauDeBord', { annee: S.annee }).then(function (d) {
    var h = '';
    if (!d.sections.finance && !d.sections.parc) {
      h = '<div class="bloc vide">Aucun module ne vous est encore attribué.<br>Demandez à l\'administrateur de RAIA de vous donner accès à la Comptabilité, la Logistique ou au Commercial.</div>';
    }
    if (d.finance) h += blocFinance(d.finance);
    if (d.parc) h += blocParc(d.parc);
    $('#contenu').innerHTML = h;
    var sel = $('#selAnnee');
    if (sel) sel.onchange = function () { S.annee = sel.value; vueTableauDeBord(); };
    $$('[data-fac]').forEach(function (tr) { tr.onclick = function () { ouvrirParId('factures', tr.getAttribute('data-fac')); }; });
  }).catch(erreurVue);
}

function kpi(l, v, s, cl) { return '<div class="kpi ' + (cl || '') + '"><div class="l">' + esc(l) + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>'; }

function blocFinance(f) {
  var k = f.kpi, opts = '<option value="toutes">Toutes</option>' + f.annees_disponibles.slice().reverse().map(function (y) { return '<option ' + (String(y) === String(f.annee) ? 'selected' : '') + '>' + y + '</option>'; }).join('');
  var h = '<div class="titre-sec"><h2>Facturation & recouvrement</h2><div class="trait"></div><label class="compte">Année <select id="selAnnee" class="btn-c" style="padding:5px 8px;border-radius:6px;border:1px solid #D1D5DB">' + opts + '</select></label></div>';
  h += '<div class="grille-kpi">' +
    kpi('CA facturé HT', fcfa(k.ca_ht), k.nb_factures + ' factures émises') +
    kpi('CA facturé TTC', fcfa(k.ca_ttc), 'dont TVA ' + fcfa(k.tva)) +
    kpi('Encaissé TTC', fcfa(k.encaisse), pct(k.taux) + ' encaissé · objectif ' + pct(k.objectif), k.taux < k.objectif ? 'o' : '') +
    kpi('Reste à recouvrer', fcfa(k.reste), k.nb_ouvertes + ' factures ouvertes (toutes années)') +
    kpi('Dont en retard', fcfa(k.retard), k.nb_retard + ' factures en retard', 'r') +
    kpi('Retenues de garantie', fcfa(k.retenues), 'à libérer') + '</div>';
  var maxT = Math.max.apply(null, f.tranches.map(function (t) { return t.montant; }).concat([1]));
  var barres = f.tranches.map(function (t, i) {
    return '<div class="ln"><span>' + esc(t.libelle) + '</span><div class="piste"><div class="rempli ' + (i > 0 ? 'r' : '') + '" style="width:' + (100 * t.montant / maxT).toFixed(1) + '%"></div></div><span class="val">' + fcfa(t.montant) + ' <span class="compte">(' + t.nombre + ')</span></span></div>';
  }).join('');
  var maxA = Math.max.apply(null, f.par_annee.map(function (a) { return a.ca_ht; }).concat([1]));
  var cols = f.par_annee.slice(-7).map(function (a) {
    return '<div class="c"><b>' + NF.format(Math.round(a.ca_ht / 1e6)) + ' M</b><i style="height:' + Math.max(2, 100 * a.ca_ht / maxA).toFixed(1) + '%"></i>' + a.annee + '</div>';
  }).join('');
  h += '<div class="deux"><div class="bloc"><h3>Balance âgée des créances (reste TTC)</h3><div class="barres">' + barres + '</div></div>' +
    '<div class="bloc"><h3>Chiffre d\'affaires HT par année</h3><div class="cols">' + cols + '</div></div></div>';
  var cl = f.clients.map(function (c) {
    return '<tr><td>' + esc(c.client) + '</td><td class="n">' + c.nombre + '</td><td class="n"><b>' + fcfa(c.reste) + '</b></td><td class="n" style="color:var(--rouge)">' + fcfa(c.retard) + '</td><td class="n">' + (c.retard_max ? c.retard_max + ' j' : '') + '</td><td class="n">' + pct(c.part) + '</td></tr>';
  }).join('');
  var rt = f.retards.map(function (r) {
    var cls = r.retard > 90 ? 's-retard' : r.retard > 30 ? 's-proche' : 's-attente';
    return '<tr data-fac="' + esc(r.id) + '"><td>' + esc(r.numero) + '</td><td>' + esc(r.client) + '</td><td>' + esc(r.chantier) + '</td><td>' + dfr(r.echeance) + '</td><td class="n"><span class="pastille ' + cls + '">' + r.retard + ' j</span></td><td class="n"><b>' + fcfa(r.reste_ttc) + '</b></td></tr>';
  }).join('');
  h += '<div class="bloc"><h3>Encours par client</h3><div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>Client</th><th class="n">Factures ouvertes</th><th class="n">Reste TTC</th><th class="n">Dont en retard</th><th class="n">Retard max</th><th class="n">Part</th></tr></thead><tbody>' + (cl || '<tr><td colspan="6" class="vide">Aucune créance ouverte</td></tr>') + '</tbody></table></div></div>';
  h += '<div class="bloc"><h3>Factures en retard à relancer en priorité</h3><div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>N° facture</th><th>Client</th><th>Chantier</th><th>Échéance</th><th class="n">Retard</th><th class="n">Reste TTC</th></tr></thead><tbody>' + (rt || '<tr><td colspan="6" class="vide">Aucune facture en retard</td></tr>') + '</tbody></table></div></div>';
  return h;
}

function blocParc(p) {
  var k = p.kpi;
  var h = '<div class="titre-sec"><h2>Parc engins & logistique</h2><div class="trait"></div></div>';
  h += '<div class="grille-kpi">' +
    kpi('Engins suivis', k.nb_engins, '') +
    kpi('Relevés ce mois', k.releves_mois, '') +
    kpi('Carburant ce mois', nb(k.carburant_mois) + ' L', '') +
    kpi('Dépenses ce mois', fcfa(k.depenses_mois), 'relevés + journal des dépenses') +
    kpi('Alertes', k.nb_alertes, 'contrôles, assurances, relevés', k.nb_alertes ? 'r' : '') + '</div>';
  var maxM = Math.max.apply(null, p.mensuel.map(function (m) { return m.carburant; }).concat([1]));
  var cols = p.mensuel.map(function (m) { return '<div class="c"><b>' + NF.format(m.carburant) + ' L</b><i style="height:' + Math.max(2, 100 * m.carburant / maxM).toFixed(1) + '%"></i>' + mFr(m.mois) + '</div>'; }).join('');
  var al = p.alertes.map(function (a) {
    var cls = a.jours < 0 ? 's-retard' : 's-proche';
    var txt = a.objet === 'Aucun relevé depuis' ? 'depuis ' + (-a.jours) + ' j' : (a.jours < 0 ? 'dépassé de ' + (-a.jours) + ' j' : 'dans ' + a.jours + ' j');
    return '<tr><td><b>' + esc(a.engin) + '</b> <span class="compte">' + esc(a.immatriculation) + '</span></td><td>' + esc(a.objet) + '</td><td>' + dfr(a.date) + '</td><td class="n"><span class="pastille ' + cls + '">' + txt + '</span></td></tr>';
  }).join('');
  h += '<div class="deux"><div class="bloc"><h3>Carburant consommé (6 derniers mois)</h3><div class="cols">' + cols + '</div></div>' +
    '<div class="bloc"><h3>Alertes du parc</h3><div class="tab-wrap" style="box-shadow:none;max-height:240px"><table class="t"><tbody>' + (al || '<tr><td class="vide">Aucune alerte</td></tr>') + '</tbody></table></div></div></div>';
  var en = p.engins.map(function (e) {
    return '<tr><td><b>' + esc(e.code) + '</b></td><td>' + esc(e.type) + '</td><td>' + esc(e.immatriculation) + '</td><td>' + esc(e.conducteur) + '</td><td class="n">' + nb(e.compteur) + ' ' + esc(e.unite || '') + '</td><td>' + dfr(e.dernier) + '</td><td class="n">' + nb(e.carburant) + ' L</td><td class="n">' + fcfa(e.depenses) + '</td></tr>';
  }).join('');
  h += '<div class="bloc"><h3>Situation des engins (mois en cours)</h3><div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>Engin</th><th>Type</th><th>Immatriculation</th><th>Conducteur</th><th class="n">Compteur</th><th>Dernier relevé</th><th class="n">Carburant</th><th class="n">Dépenses</th></tr></thead><tbody>' + en + '</tbody></table></div></div>';
  return h;
}

/* ---------- pilotage DG ---------- */
function vuePilotage() {
  var P = S.pil = S.pil || { onglet: 'finance', annee: String(new Date().getFullYear()), debut: auj().slice(0, 8) + '01', fin: auj(), filtre: 'tous' };
  entete('Pilotage DG', 'Indicateurs de direction et contrôle de la qualité des données · situation au ' + dfr(auj()),
    '<button class="btn btn-c" id="bPilMaj">Actualiser</button>');
  $('#bPilMaj').onclick = vuePilotage;
  chargement();
  appel('pilotage', { annee: P.annee, debut: P.debut, fin: P.fin }).then(function (d) {
    S.pilData = d; dessinerPilotage();
  }).catch(erreurVue);
}

function compterCtrl(d) {
  var e = 0, a = 0, pe = 0, pa = 0;
  d.controles.forEach(function (c) { if (!c.nombre) return; if (c.gravite === 'e') { e += c.nombre; pe++; } else { a += c.nombre; pa++; } });
  return { e: e, a: a, pe: pe, pa: pa };
}

function dessinerPilotage() {
  var d = S.pilData, P = S.pil, f = d.finance, ind = f.indicateurs, n = compterCtrl(d);
  var evo = ind.evolution == null ? 'pas de comparaison' : (ind.evolution >= 0 ? '+' : '') + pct(ind.evolution) + ' vs ' + (ind.annee_n - 1) + ' à la même date';
  var h = '<div class="grille-kpi">' +
    kpi('Taux de recouvrement ' + f.annee, pct(ind.realise), (ind.atteint ? '✔ Objectif atteint' : '⚠ Sous l\'objectif') + ' (' + pct(ind.objectif) + ')', ind.atteint ? '' : 'o') +
    kpi('Créances > 90 jours', fcfa(ind.creances_90), ind.nb_90 + ' factures · ' + pct(ind.part_90) + ' de l\'encours', ind.creances_90 ? 'r' : '') +
    kpi('CA HT ' + ind.annee_n + ' à date', fcfa(ind.ca_ytd), evo, ind.evolution != null && ind.evolution < 0 ? 'o' : '') +
    '<div class="kpi ' + (n.e ? 'r' : n.a ? 'o' : '') + '" id="kCtrl" style="cursor:pointer"><div class="l">Anomalies dans les données</div><div class="v">' + (n.e + n.a) + '</div><div class="s">' +
    (n.e ? n.e + ' erreur(s) à corriger' : 'aucune erreur') + (n.a ? ' · ' + n.a + ' point(s) à vérifier' : '') + ' ›</div></div></div>';
  var tabs = [['finance', 'Finance & recouvrement'], ['parc', 'Parc & engins'], ['ctrl', 'Contrôle des données' + (n.e + n.a ? ' <span class="pastille ' + (n.e ? 's-retard' : 's-proche') + '">' + (n.e + n.a) + '</span>' : '')]];
  h += '<div class="onglets">' + tabs.map(function (t) { return '<button data-o="' + t[0] + '" class="' + (P.onglet === t[0] ? 'actif' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="pilCorps"></div>';
  $('#contenu').innerHTML = h;
  $$('.onglets button').forEach(function (b) { b.onclick = function () { P.onglet = b.getAttribute('data-o'); dessinerPilotage(); }; });
  $('#kCtrl').onclick = function () { P.onglet = 'ctrl'; dessinerPilotage(); };
  if (P.onglet === 'parc') pilParc(d); else if (P.onglet === 'ctrl') pilCtrl(d); else pilFinance(d);
}

function pilFinance(d) {
  var f = d.finance, k = f.kpi, ind = f.indicateurs, P = S.pil;
  var opts = '<option value="toutes">Toutes</option>' + f.annees_disponibles.slice().reverse().map(function (y) { return '<option ' + (String(y) === String(f.annee) ? 'selected' : '') + '>' + y + '</option>'; }).join('');
  var h = '<div class="titre-sec"><h2>Facturation & recouvrement</h2><div class="trait"></div><label class="compte">Année <select id="pilAnnee" class="champ-mini">' + opts + '</select></label></div>';
  h += '<div class="grille-kpi">' +
    kpi('CA facturé HT', fcfa(k.ca_ht), k.nb_factures + ' factures émises') +
    kpi('CA facturé TTC', fcfa(k.ca_ttc), 'dont TVA ' + fcfa(k.tva)) +
    kpi('Encaissé TTC', fcfa(k.encaisse), pct(k.taux) + ' encaissé', k.taux < k.objectif ? 'o' : '') +
    kpi('Reste à recouvrer', fcfa(k.reste), k.nb_ouvertes + ' factures ouvertes') +
    kpi('Dont en retard', fcfa(k.retard), k.nb_retard + ' factures en retard', 'r') +
    kpi('Retenues de garantie', fcfa(k.retenues), 'à libérer') + '</div>';
  // balance âgée détaillée
  var tot = f.tranches.reduce(function (a, t) { return a + t.montant; }, 0) || 1;
  var bal = f.tranches.map(function (t, i) {
    return '<tr><td>' + esc(t.libelle) + '</td><td class="n">' + t.nombre + '</td><td class="n"><b>' + fcfa(t.montant) + '</b></td><td class="n">' + pct(t.montant / tot) + '</td><td style="width:40%"><div class="piste-mini"><div class="' + (i ? 'r' : '') + '" style="width:' + (100 * t.montant / tot).toFixed(1) + '%"></div></div></td></tr>';
  }).join('');
  var obj = '<div class="obj"><div><span class="compte">Objectif</span><b>' + pct(ind.objectif) + '</b></div><div><span class="compte">Réalisé (' + esc(f.annee) + ')</span><b>' + pct(ind.realise) + '</b></div>' +
    '<div><span class="compte">Verdict</span><b class="' + (ind.atteint ? 'n-ok' : 'n-e') + '">' + (ind.atteint ? '✔ Atteint' : '⚠ Sous l\'objectif') + '</b></div></div>' +
    '<div class="piste-mini" style="height:12px;margin-top:10px;position:relative"><div style="width:' + Math.min(100, ind.realise * 100).toFixed(1) + '%"></div><span class="repere" style="left:' + (ind.objectif * 100).toFixed(1) + '%"></span></div>' +
    '<p class="compte" style="margin:12px 0 0">Créances de plus de 90 jours : <b>' + fcfa(ind.creances_90) + '</b> (' + ind.nb_90 + ' factures, ' + pct(ind.part_90) + ' de l\'encours).<br>' +
    'CA HT ' + ind.annee_n + ' au ' + dfr(d.date) + ' : <b>' + fcfa(ind.ca_ytd) + '</b> contre ' + fcfa(ind.ca_ytd_prec) + ' en ' + (ind.annee_n - 1) + ' à la même date' + (ind.evolution != null ? ' (<b class="' + (ind.evolution < 0 ? 'n-e' : 'n-ok') + '">' + (ind.evolution >= 0 ? '+' : '') + pct(ind.evolution) + '</b>)' : '') + '.</p>';
  h += '<div class="deux"><div class="bloc"><h3>Balance âgée des créances (reste TTC)</h3><div class="tab-wrap" style="box-shadow:none"><table class="t tl"><thead><tr><th>Tranche</th><th class="n">Factures</th><th class="n">Montant</th><th class="n">Poids</th><th></th></tr></thead><tbody>' + bal +
    '</tbody><tfoot><tr><td>Total</td><td class="n">' + f.tranches.reduce(function (a, t) { return a + t.nombre; }, 0) + '</td><td class="n">' + fcfa(tot) + '</td><td class="n">100 %</td><td></td></tr></tfoot></table></div></div>' +
    '<div class="bloc"><h3>Objectif de recouvrement</h3>' + obj + '</div></div>';
  // activité par année
  var act = f.activite.slice().reverse().map(function (a) {
    return '<tr><td><b>' + a.annee + '</b></td><td class="n">' + a.nombre + '</td><td class="n">' + fcfa(a.ca_ht) + '</td><td class="n">' + fcfa(a.ca_ttc) + '</td><td class="n">' + fcfa(a.encaisse) + '</td><td class="n"><span class="' + (a.taux >= ind.objectif ? 'n-ok' : 'n-e') + '">' + pct(a.taux) + '</span></td></tr>';
  }).join('');
  var sAct = f.activite.reduce(function (o, a) { o.n += a.nombre; o.ht += a.ca_ht; o.ttc += a.ca_ttc; o.enc += a.encaisse; return o; }, { n: 0, ht: 0, ttc: 0, enc: 0 });
  h += '<div class="bloc"><h3>Activité par année</h3><div class="tab-wrap" style="box-shadow:none"><table class="t tl"><thead><tr><th>Année</th><th class="n">Factures</th><th class="n">CA HT</th><th class="n">CA TTC</th><th class="n">Encaissé TTC</th><th class="n">Taux d\'encaissement</th></tr></thead><tbody>' + act +
    '</tbody><tfoot><tr><td>Total</td><td class="n">' + sAct.n + '</td><td class="n">' + fcfa(sAct.ht) + '</td><td class="n">' + fcfa(sAct.ttc) + '</td><td class="n">' + fcfa(sAct.enc) + '</td><td class="n">' + pct(sAct.ttc ? sAct.enc / sAct.ttc : 0) + '</td></tr></tfoot></table></div></div>';
  // encours par client
  var cl = f.clients.map(function (c) {
    return '<tr class="tl"><td>' + esc(c.client) + '</td><td class="n">' + c.nombre + '</td><td class="n"><b>' + fcfa(c.reste) + '</b></td><td class="n" style="color:var(--rouge)">' + fcfa(c.retard) + '</td><td class="n">' + (c.retard_max ? c.retard_max + ' j' : '') + '</td><td class="n">' + pct(c.part) + '</td><td>' + dfr(c.derniere) + '</td></tr>';
  }).join('');
  h += '<div class="bloc"><h3>Encours par client (du plus gros au plus petit)</h3><div class="tab-wrap" style="box-shadow:none"><table class="t tl"><thead><tr><th>Client</th><th class="n">Factures ouvertes</th><th class="n">Reste TTC</th><th class="n">Dont en retard</th><th class="n">Retard max</th><th class="n">Part encours</th><th>Dernière facture</th></tr></thead><tbody>' +
    (cl || '<tr><td colspan="7" class="vide">Aucune créance ouverte</td></tr>') + '</tbody><tfoot><tr><td>Total</td><td class="n">' + k.nb_ouvertes + '</td><td class="n">' + fcfa(k.reste) + '</td><td class="n">' + fcfa(k.retard) + '</td><td></td><td class="n">100 %</td><td></td></tr></tfoot></table></div></div>';
  // top retards
  var rt = f.retards.map(function (r) {
    var cls = r.priorite === 'Critique' ? 's-retard' : r.priorite === 'Élevée' ? 's-proche' : 's-attente';
    return '<tr data-fac="' + esc(r.id) + '"><td>' + esc(r.numero) + '</td><td>' + dfr(r.date_emission) + '</td><td>' + esc(r.client) + '</td><td>' + esc(r.chantier) + '</td><td>' + dfr(r.echeance) + '</td><td class="n">' + r.retard + ' j</td><td class="n"><b>' + fcfa(r.reste_ttc) + '</b></td><td><span class="pastille ' + cls + '">' + r.priorite + '</span></td></tr>';
  }).join('');
  h += '<div class="bloc"><h3>Top 15 des factures en retard — à relancer en priorité</h3><div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>N° facture</th><th>Émise le</th><th>Client</th><th>Chantier</th><th>Échéance</th><th class="n">Retard</th><th class="n">Reste TTC</th><th>Priorité</th></tr></thead><tbody>' +
    (rt || '<tr><td colspan="8" class="vide">Aucune facture en retard</td></tr>') + '</tbody></table></div><p class="compte" style="margin:10px 0 0">Total en retard : ' + k.nb_retard + ' facture(s) pour ' + fcfa(k.retard) + '. Cliquez sur une ligne pour ouvrir la facture.</p></div>';
  $('#pilCorps').innerHTML = h;
  $('#pilAnnee').onchange = function () { P.annee = this.value; vuePilotage(); };
  $$('[data-fac]', $('#pilCorps')).forEach(function (tr) { tr.onclick = function () { ouvrirParId('factures', tr.getAttribute('data-fac')); }; });
}

function pastEch(s) {
  if (!s || s.etat === 'nd') return '<span class="compte">—</span>';
  var cls = s.etat === 'retard' ? 's-retard' : s.etat === 'proche' ? 's-proche' : 's-payee';
  var t = s.etat === 'retard' ? 'Expiré' : s.etat === 'proche' ? s.jours + ' j' : 'OK';
  return '<span class="pastille ' + cls + '" title="' + dfr(s.date) + '">' + t + '</span>';
}

function pilParc(d) {
  var p = d.parc, t = p.totaux, P = S.pil;
  var h = '<div class="titre-sec"><h2>Récap du parc engins</h2><div class="trait"></div><span class="compte">Du</span> <input type="date" id="pilDeb" class="champ-mini" value="' + esc(d.periode.debut) + '"> <span class="compte">au</span> <input type="date" id="pilFin" class="champ-mini" value="' + esc(d.periode.fin) + '"> <button class="btn btn-c" id="pilPer" style="padding:5px 10px">Appliquer</button></div>';
  h += '<div class="grille-kpi">' + kpi('Distance véhicules', nb(t.km) + ' km', 'écart entre relevés successifs') + kpi('Heures engins', nb(t.heures) + ' h', '') +
    kpi('Carburant', nb(t.carburant) + ' L', '') + kpi('Dépenses', fcfa(t.depenses), 'relevés + journal des dépenses') +
    kpi('Saisies', t.saisies, 'relevés sur la période') + kpi('Anomalies de relevés', t.anomalies, 'voir Contrôle des données', t.anomalies ? 'o' : '') + '</div>';
  var en = p.engins.map(function (e) {
    var u = e.unite, conso = e.conso === '' ? '' : nb(Math.round(e.conso * 100) / 100) + (u === 'h' ? ' L/h' : ' L/100');
    var ve = e.vidange || {}, vid = !ve.statut || ve.statut === 'nd' ? '<span class="compte" title="Renseignez la date et le compteur de la dernière vidange">Non renseignée</span>' : '<span class="pastille ' + (ve.statut === 'retard' ? 's-retard' : ve.statut === 'proche' ? 's-proche' : 's-payee') + '" title="' + esc(ve.texte + ' · intervalle ' + ve.intervalle + ' ' + ve.unite + ' (' + ve.source + ') ou ' + ve.mois + ' mois') + '">' + esc(ve.statut === 'retard' ? 'À faire' : ve.reste !== '' ? (ve.statut === 'proche' ? 'Bientôt · ' : '') + nb(ve.reste) + ' ' + ve.unite : 'le ' + dfr(ve.limite)) + '</span>';
    return '<tr data-eng="' + esc(e.id) + '"><td><b>' + esc(e.code) + '</b><div class="compte">' + esc(e.immatriculation || '') + '</div></td><td>' + esc(e.type || '') + '</td><td class="n">' + nb(e.debut) + '</td><td class="n">' + nb(e.fin) + '</td><td class="n"><b>' + nb(e.parcouru) + ' ' + u + '</b></td><td class="n">' + e.jours_actifs + '</td><td class="n">' + nb(e.carburant) + ' L</td>' +
      '<td class="n"><span class="' + (e.conso_alerte ? 'n-e' : '') + '" title="' + (e.conso_ref !== '' ? 'Référence : ' + e.conso_ref : '') + '">' + conso + (e.conso_alerte ? ' ⚠' : '') + '</span></td><td class="n">' + fcfa(e.depenses) + '</td><td class="n">' + e.saisies + '</td><td class="n">' + (e.anomalies ? '<span class="n-e">' + e.anomalies + '</span>' : '0') + '</td>' +
      '<td>' + vid + '</td><td>' + pastEch(e.ct) + '</td><td>' + pastEch(e.assurance) + '</td><td>' + pastEch(e.patente) + '</td><td>' + pastEch(e.station) + '</td></tr>';
  }).join('');
  h += '<div class="bloc"><h3>1. Synthèse par engin</h3><div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>Engin</th><th>Type</th><th class="n">Compteur début</th><th class="n">Compteur fin</th><th class="n">Parcouru</th><th class="n">Jours actifs</th><th class="n">Carburant</th><th class="n">Conso</th><th class="n">Dépenses</th><th class="n">Saisies</th><th class="n">Anomalies</th><th>Vidange (reste)</th><th>Visite tech.</th><th>Assurance</th><th>Patente</th><th>Stationnement</th></tr></thead><tbody>' + en +
    '</tbody><tfoot><tr><td colspan="4">Total</td><td class="n">' + nb(t.km) + ' km · ' + nb(t.heures) + ' h</td><td></td><td class="n">' + nb(t.carburant) + ' L</td><td></td><td class="n">' + fcfa(t.depenses) + '</td><td class="n">' + t.saisies + '</td><td class="n">' + t.anomalies + '</td><td colspan="5"></td></tr></tfoot></table></div>' +
    '<p class="compte" style="margin:10px 0 0">Parcouru = somme des écarts entre relevés successifs, hors relevés en anomalie. Vidange : due au premier terme atteint, kilométrage (selon l\'huile) ou date (tous les N mois) — survolez la pastille pour le détail. Conso en L/100 km (véhicules) ou L/h (engins) ; ⚠ = au-dessus de la consommation de référence de la fiche engin. Cliquez sur un engin pour ouvrir sa fiche.</p></div>';

/* ---------- tables génériques ---------- */
function schema(t) { return S.ctx.tables[t]; }
function colonnesVisibles(t) { return schema(t).champs.filter(function (c) { return c.liste_col; }); }
function estNum(c) { return c.t === 'number' || c.t === 'money'; }
function affiche(c, v) {
  if (v === '' || v == null) return '';
  if (c.n === 'prochaine_vidange') { var cl = /^À faire/.test(v) ? 's-retard' : /^À prévoir/.test(v) ? 's-proche' : /non renseignée/.test(v) ? 's-attente' : 's-payee'; return '<span class="pastille ' + cl + '" title="' + esc(v) + '">' + esc(v.replace(/^À (faire|prévoir) : /, '')) + '</span>'; }

  if (c.t === 'money') return fcfa(v);
  if (c.t === 'number') return nb(v);
  if (c.t === 'date') return dfr(v);
  if (c.t === 'url') return '<a href="' + esc(v) + '" target="_blank" onclick="event.stopPropagation()">Ouvrir</a>';
  return esc(v);
}

function vueTable(t) {
  var sc = schema(t), d = sc.droits;
  var info = d.creer && !d.modifier ? 'Vous pouvez consulter et ajouter.' : (!d.creer ? 'Consultation seule.' : '');
  entete(sc.titre, info, d.creer ? '<button class="btn btn-p" id="bAjout">+ Ajouter</button>' : '');
  if (d.creer) $('#bAjout').onclick = function () { ouvrirFormulaire(t, null); };
  chargement();
  appel('lister', { table: t }).then(function (r) {
    S.cache[t] = r.lignes;
    S.filtres[t] = S.filtres[t] || { q: '', tri: sc.tri, desc: sc.triDesc, page: 0, f: {} };
    dessinerTable(t);
  }).catch(erreurVue);
}

function filtresSpecifiques(t) {
  if (t === 'factures') return [{ n: 'statut', l: 'Tous les statuts', v: ['En retard', 'Échéance proche', 'En attente', 'Payée', 'Annulée'] }, { n: 'chantier', l: 'Tous les chantiers' }, { n: 'annee', l: 'Toutes les années' }];
  if (t === 'releves' || t === 'depenses') return [{ n: 'engin', l: 'Tous les engins' }, { n: 'mois', l: 'Tous les mois' }];
  if (t === 'engins') return [{ n: 'type', l: 'Tous les types' }];
  return [];
}

function lignesFiltrees(t) {
  var F = S.filtres[t], q = F.q.toLowerCase().trim(), L = S.cache[t] || [], AN = F.anom && t === 'releves' ? anomaliesReleves() : null;
  var res = L.filter(function (l) {
    for (var k in F.f) {
      var v = F.f[k]; if (!v) continue;
      if (k === 'annee') { if (String(l.date_emission || '').slice(0, 4) !== v) return false; }
      else if (k === 'mois') { if (String(l.date || '').slice(0, 7) !== v) return false; }
      else if (String(l[k] || '') !== v) return false;
    }
    if (AN && !(AN.err[l.id] || AN.trou[l.id])) return false;
    if (!q) return true;
    for (var c in l) if (String(l[c]).toLowerCase().indexOf(q) >= 0) return true;
    return false;
  });
  var tri = F.tri, desc = F.desc ? -1 : 1, champ = schema(t).champs.filter(function (c) { return c.n === tri; })[0];
  res.sort(function (a, b) {
    var x = a[tri], y = b[tri];
    if (champ && estNum(champ)) { x = x === '' ? -Infinity : Number(x); y = y === '' ? -Infinity : Number(y); }
    else { x = String(x || ''); y = String(y || ''); }
    return x < y ? -desc : x > y ? desc : 0;
  });
  if (F.grp) {
    var rang = {}; res.forEach(function (l, i) { rang[l.id] = i; });
    res.sort(function (a, b) {
      var ca = nomGroupe(a), cb = nomGroupe(b);
      if (ca !== cb) return ca === 'Sans chantier' ? 1 : cb === 'Sans chantier' ? -1 : ca.localeCompare(cb, 'fr');
      return rang[a.id] - rang[b.id];
    });
  }
  return res;
}

function nomGroupe(l) { var c = String(l.chantier || '').trim(); return c || 'Sans chantier'; 
}

/* Relevés : jours non saisis entre deux relevés d'un même engin, et lignes en erreur (rouge). */
function anomaliesReleves() {
  var L = S.cache.releves || [], E = {}, par = {}, err = {}, trou = {}, nbTrous = 0;
  (S.cache.engins || []).forEach(function (e) { E[e.code || e.id] = e; });
  var iso = /^\d{4}-\d{2}-\d{2}$/, j = 86400000, aujd = auj();
  L.forEach(function (l) {
    var d = String(l.date || '').slice(0, 10);
    if (!iso.test(d)) { (err[l.id] = err[l.id] || []).push('date invalide'); return; }
    if (d > aujd) (err[l.id] = err[l.id] || []).push('date dans le futur');
    (par[l.engin || '?'] = par[l.engin || '?'] || []).push(l);
  });
  Object.keys(par).forEach(function (en) {
    var ls = par[en].sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (Number(a.compteur) || 0) - (Number(b.compteur) || 0); });
    var h = E[en] && E[en].unite === 'h', prec = null, vus = {};
    ls.forEach(function (l, i) {
      var d = String(l.date).slice(0, 10), k = String(l.compteur == null ? '' : l.compteur).trim(), e = [];
      if (vus[d]) e.push('2 relevés le même jour'); vus[d] = 1;
      if (k === '') e.push(l.photo ? 'compteur à lire sur la photo' : 'compteur manquant');
      if (i > 0) {
        var p = ls[i - 1], dp = String(p.date).slice(0, 10), ecart = Math.round((new Date(d + 'T12:00:00') - new Date(dp + 'T12:00:00')) / j);
        if (ecart > 1) { trou[l.id] = { n: ecart - 1, du: dp, au: d, engin: en }; nbTrous++; }
      }
      if (k !== '' && prec) {
        var n = Number(k), np = Number(prec.compteur), jrs = Math.max(1, Math.round((new Date(d + 'T12:00:00') - new Date(String(prec.date).slice(0, 10) + 'T12:00:00')) / j));
        if (n < np) e.push('compteur inférieur au relevé précédent (' + nb(np) + ')');
        else if (n - np > (h ? 24 : 1500) * jrs) e.push('saut de compteur anormal (+' + nb(n - np) + (h ? ' h' : ' km') + ' en ' + jrs + ' j)');
      }
      if (k !== '') prec = l;
      if (e.length) err[l.id] = (err[l.id] || []).concat(e);
    });
  });
  return { err: err, trou: trou, nbErr: Object.keys(err).length, nbTrous: nbTrous };
}
function ligneTrou(z, nCols) {
  var lendemain = function (d, s) { var x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + s); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  var du = lendemain(z.du, 1), au = lendemain(z.au, -1);
  return '<tr class="trou"><td colspan="' + nCols + '">⚠ ' + esc(z.engin) + ' : ' + z.n + ' jour' + (z.n > 1 ? 's' : '') + ' non saisi' + (z.n > 1 ? 's' : '') + (z.n > 1 ? ' (du ' + dfr(du) + ' au ' + dfr(au) + ')' : ' (' + dfr(du) + ')') + '</td></tr>';
}

function dessinerTable(t) {
  var sc = schema(t), F = S.filtres[t], cols = colonnesVisibles(t), L = S.cache[t] || [];
  var fs = filtresSpecifiques(t).map(function (f) {
    var vals = f.v;
    if (!vals) {
      var set = {};
      L.forEach(function (l) {
        var v = f.n === 'annee' ? String(l.date_emission || '').slice(0, 4) : f.n === 'mois' ? String(l.date || '').slice(0, 7) : l[f.n];
        if (v) set[v] = 1;
      });
      vals = Object.keys(set).sort(function (x, y) { return String(x).localeCompare(String(y), 'fr'); }); if (f.n === 'annee' || f.n === 'mois') vals.reverse();
    }
    return '<select data-f="' + f.n + '"><option value="">' + esc(f.l) + '</option>' + vals.map(function (v) { return '<option ' + (F.f[f.n] === v ? 'selected' : '') + ' value="' + esc(v) + '">' + esc(f.n === 'mois' ? mFr(v) : v) + '</option>'; }).join('') + '</select>';
  }).join('');
  var res = lignesFiltrees(t), parPage = F.grp ? 100000 : 50, nbPages = Math.max(1, Math.ceil(res.length / parPage));
  if (F.page >= nbPages) F.page = nbPages - 1;
  var page = res.slice(F.page * parPage, (F.page + 1) * parPage);
  var tete = cols.map(function (c) { return '<th data-tri="' + c.n + '" class="' + (estNum(c) ? 'n' : '') + '">' + esc(c.l) + (F.tri === c.n ? (F.desc ? ' ▼' : ' ▲') : '') + '</th>'; }).join('');
  var A = t === 'releves' ? anomaliesReleves() : null;
  var ligneTr = function (l) {
    var e = A && A.err[l.id], z = A && A.trou[l.id];
    var tr = '<tr data-id="' + esc(l.id) + '"' + (e ? ' class="err" title="' + esc('⚠ ' + e.join(' · ')) + '"' : '') + '>' + cols.map(function (c) { return '<td class="' + (estNum(c) ? 'n' : '') + '">' + affiche(c, l[c.n]) + '</td>'; }).join('') + '</tr>';
    if (!z) return tr;
    return F.tri === 'date' && !F.desc ? ligneTrou(z, cols.length) + tr : tr + ligneTrou(z, cols.length);
  };
  var corps;
  if (F.grp) {
    var grp = {}, ordre = [];
    page.forEach(function (l) { var g = nomGroupe(l); if (!grp[g]) { grp[g] = []; ordre.push(g); } grp[g].push(l); });
    F.ferme = F.ferme || {};
    corps = ordre.map(function (g) {
      var ls = grp[g], ferme = F.ferme[g];
      var tete = cols.map(function (c, i) {
        if (c.t === 'money') return '<td class="n">' + fcfa(ls.reduce(function (a, l) { return a + (Number(l[c.n]) || 0); }, 0)) + '</td>';
        return '<td>' + (i === 0 ? (ferme ? '▸ ' : '▾ ') + esc(g) + ' (' + ls.length + ')' : '') + '</td>';
      }).join('');
      return '<tr class="grp" data-g="' + esc(g) + '">' + tete + '</tr>' + (ferme ? '' : ls.map(ligneTr).join(''));
    }).join('');
  } else corps = page.map(ligneTr).join('');
  var totaux = cols.map(function (c, i) {
    if (c.t === 'money' || c.n === 'carburant' || c.n === 'litres') { var s = res.reduce(function (a, l) { return a + (Number(l[c.n]) || 0); }, 0); return '<td class="n">' + (c.t === 'money' ? fcfa(s) : nb(s)) + '</td>'; }
    return '<td>' + (i === 0 ? 'Total (' + res.length + ')' : '') + '</td>';
  }).join('');
  $('#contenu').innerHTML =
    '<div class="outils"><input type="search" id="q" placeholder="Rechercher…" value="' + esc(F.q) + '">' + fs +
    (t === 'factures' ? '<button class="btn btn-c btn-s' + (F.grp ? ' btn-on' : '') + '" id="bGrp">Regrouper par chantier</button>' : '') +
    (A ? '<button class="btn btn-c btn-s' + (F.anom ? ' btn-on' : '') + '" id="bAnom" title="Lignes rouges : erreurs (compteur manquant, en recul, saut anormal, doublon, date). Bandeaux rouges : jours non saisis.">⚠ Anomalies : ' + A.nbErr + ' erreur' + (A.nbErr > 1 ? 's' : '') + ' · ' + A.nbTrous + ' trou' + (A.nbTrous > 1 ? 's' : '') + '</button>' : '') +
    '<span class="esp"></span><span class="compte">' + res.length + ' / ' + L.length + ' lignes</span>' +
    '<button class="btn btn-c btn-s" id="bCsv">Exporter (Excel)</button></div>' +
    '<div class="tab-wrap"><table class="t"><thead><tr>' + tete + '</tr></thead><tbody>' + (corps || '<tr><td colspan="' + cols.length + '" class="vide">Aucune donnée</td></tr>') + '</tbody>' +
    (res.length ? '<tfoot><tr>' + totaux + '</tr></tfoot>' : '') + '</table>' +
    '<div class="pagin"><button class="btn btn-c btn-s" id="pPrec" ' + (F.page ? '' : 'disabled') + '>‹</button> Page ' + (F.page + 1) + ' / ' + nbPages + ' <button class="btn btn-c btn-s" id="pSuiv" ' + (F.page < nbPages - 1 ? '' : 'disabled') + '>›</button></div></div>';
  var q = $('#q'); q.oninput = function () { F.q = q.value; F.page = 0; var p = q.selectionStart; dessinerTable(t); var nq = $('#q'); nq.focus(); nq.setSelectionRange(p, p); };
  $$('[data-f]').forEach(function (s) { s.onchange = function () { F.f[s.getAttribute('data-f')] = s.value; F.page = 0; dessinerTable(t); }; });
  $$('th[data-tri]').forEach(function (th) { th.onclick = function () { var n = th.getAttribute('data-tri'); if (F.tri === n) F.desc = !F.desc; else { F.tri = n; F.desc = false; } dessinerTable(t); }; });
  $$('tbody tr[data-id]').forEach(function (tr) { tr.onclick = function () { ouvrirParId(t, tr.getAttribute('data-id')); }; });
  if ($('#bAnom')) $('#bAnom').onclick = function () { F.anom = !F.anom; F.page = 0; dessinerTable(t); };
  if ($('#bGrp')) $('#bGrp').onclick = function () { F.grp = !F.grp; F.page = 0; dessinerTable(t); };
  $$('tr.grp').forEach(function (tr) { tr.onclick = function () { var g = tr.getAttribute('data-g'); F.ferme[g] = !F.ferme[g]; dessinerTable(t); }; });
  $('#pPrec').onclick = function () { F.page--; dessinerTable(t); };
  $('#pSuiv').onclick = function () { F.page++; dessinerTable(t); };
  $('#bCsv').onclick = function () { exporterCsv(t, res); };
}

function exporterCsv(t, lignes) {
  var ch = schema(t).champs.filter(function (c) { return c.t !== 'id'; });
  var cel = function (v) { v = v == null ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var csv = '﻿' + ch.map(function (c) { return cel(c.l); }).join(';') + '\n' +
    lignes.map(function (l) { return ch.map(function (c) { var v = l[c.n]; if (c.t === 'date') v = dfr(v); else if (estNum(c) && v !== '' && v != null) v = String(v).replace('.', ','); return cel(v); }).join(';'); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'RAIA_' + t + '_' + auj() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function ouvrirParId(t, id) {
  var go = function () { var l = (S.cache[t] || []).filter(function (x) { return x.id === id; })[0]; if (l) ouvrirFormulaire(t, l); };
  if (S.cache[t]) return go();
  appel('lister', { table: t }).then(function (r) { S.cache[t] = r.lignes; go(); }).catch(function (e) { toast(e.message, true); });
}

/* ---------- formulaire ---------- */
function optionsListe(c) {

  return (S.ctx.listes[c.liste] || []);
}

function inputChamp(c, v, lecture) {

  else if (c.t === 'select' && !c.libre) {

    h += '<select id="' + id + '"' + dis + '><option value=""></option>' + opts.map(function (o) { return '<option ' + (String(o) === String(val) ? 'selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';

  else if (c.t === 'date' && c.ro) h += '<input id="' + id + '" value="' + esc(dfr(val)) + '" disabled>';
  else if (c.t === 'date') h += '<input id="' + id + '" type="date" value="' + esc(val) + '"' + dis + '>';
  else if (c.t === 'number' || c.t === 'money') {

    else h += '<input id="' + id + '" type="number" step="any" inputmode="decimal" value="' + esc(val) + '"' + dis + '>';
  }
  else if (c.t === 'url') h += '<div class="ligne-url"><input id="' + id + '" type="url" placeholder="Lien Google Drive" value="' + esc(val) + '"' + dis + '>' +
    (val ? '<a class="btn btn-c btn-s" href="' + esc(val) + '" target="_blank">Ouvrir</a>' : '') +
    (dis ? '' : '<label class="btn btn-c btn-s">Joindre un fichier<input type="file" class="cache" data-up="' + c.n + '"></label>') + '</div>';
  else h += '<input id="' + id + '" value="' + esc(val) + '"' + dis + '>';
  if (c.aide && !dis) h += '<div class="aide">' + esc(c.aide) + '</div>';
  return h + '</div>';
}

function ouvrirFormulaire(t, ligne) {
  var sc = schema(t), d = sc.droits, nouveau = !ligne;
  var lecture = !nouveau && !d.modifier;
  var l = ligne || {};
  if (nouveau) {
    sc.champs.forEach(function (c) { if (c.t === 'date' && (c.n === 'date' || c.n === 'date_emission')) l[c.n] = t === 'releves' ? jourReleve() : auj(); });
    if (t === 'factures') { l.etat = 'Impayé'; l.delai = 30; }
    if (t === 'engins') l.unite = 'km';
    var F = S.filtres[t]; if (F && F.f && F.f.engin && (t === 'releves' || t === 'depenses')) l.engin = F.f.engin;
  }
  var champs = sc.champs.filter(function (c) { return c.t !== 'id' && !(nouveau && c.ro); });
  var v = document.createElement('div'); v.className = 'voile';
  v.innerHTML = '<div class="modale"><div class="tete"><h3>' + (nouveau ? 'Nouvel enregistrement – ' : '') + esc(sc.titre) + (l.numero ? ' · ' + esc(l.numero) : l.code ? ' · ' + esc(l.code) : '') + '</h3>' +
    (lecture ? '<span class="droits-info">Lecture seule</span>' : '') + '<button class="fermer" title="Fermer">×</button></div>' +
    '<form id="fForm"><div class="corps">' + champs.map(function (c) { return inputChamp(c, l[c.n], lecture); }).join('') + '</div><div id="fErr" style="padding:0 20px"></div>' +
    '<div class="pied">' + (!nouveau && d.supprimer ? '<button type="button" class="btn btn-r" id="bSuppr" style="margin-right:auto">Supprimer</button>' : '') +
    (t === 'factures' && !lecture ? '<button type="button" class="btn btn-c" id="bTva">TVA 18 %</button>' : '') +
    '<button type="button" class="btn btn-c" id="bAnn">' + (lecture ? 'Fermer' : 'Annuler') + '</button>' +
    (lecture ? '' : '<button type="submit" class="btn btn-p" id="bEnr">Enregistrer</button>') + '</div></form></div>';
  document.body.appendChild(v);
  var fermer = function () { v.remove(); };
  $('.fermer', v).onclick = fermer; $('#bAnn', v).onclick = fermer;
  v.addEventListener('mousedown', function (e) { if (e.target === v) fermer(); });
  if ($('#bTva', v)) $('#bTva', v).onclick = function () { var ht = Number($('#f_montant_ht', v).value || 0); $('#f_tva', v).value = Math.round(ht * 0.18 * 100) / 100; };
  if (t === 'releves' && nouveau) {
    var verifier = function () {
      var e = $('#f_engin', v).value, c = Number($('#f_compteur', v).value);
      var prec = (S.cache.releves || []).filter(function (r) { return r.engin === e && r.compteur !== '' && r.compteur != null; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
      var aide = $('#f_compteur', v).parentNode.querySelector('.aide') || (function () { var x = document.createElement('div'); x.className = 'aide'; $('#f_compteur', v).parentNode.appendChild(x); return x; })();
      aide.innerHTML = prec ? 'Dernier compteur : <b>' + nb(prec.compteur) + '</b> le ' + dfr(prec.date) + (c && c < Number(prec.compteur) ? ' <span style="color:var(--rouge)">⚠ inférieur au dernier relevé</span>' : '') : '';
    };
    $('#f_engin', v).addEventListener('change', verifier); $('#f_compteur', v).addEventListener('input', verifier); verifier();
  }
  $$('[data-up]', v).forEach(function (inp) {
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      if (f.size > 10 * 1024 * 1024) return toast('Fichier trop volumineux (10 Mo max.)', true);
      var lbl = inp.parentNode; lbl.firstChild.textContent = 'Envoi…';
      var rd = new FileReader();
      rd.onload = function () {
        appel('televerser', { table: t, nom: f.name, type: f.type, contenu: String(rd.result).split(',')[1] }).then(function (r) {
          $('#f_' + inp.getAttribute('data-up'), v).value = r.url; lbl.firstChild.textContent = 'Fichier joint ✓'; toast('Fichier enregistré dans le Drive');
        }).catch(function (e) { lbl.firstChild.textContent = 'Joindre un fichier'; toast(e.message, true); });
      };
      rd.readAsDataURL(f);
    };
  });
  if ($('#bSuppr', v)) $('#bSuppr', v).onclick = function () {
    if (!confirm('Supprimer définitivement cet enregistrement ?')) return;
    appel('supprimer', { table: t, id: l.id }).then(function () { fermer(); toast('Supprimé'); vueTable(t); }).catch(function (e) { $('#fErr', v).innerHTML = '<div class="msg msg-e">' + esc(e.message) + '</div>'; });
  };
  $('#fForm', v).addEventListener('submit', function (e) {
    e.preventDefault();
    var o = { id: l.id || '' };
    champs.forEach(function (c) { if (c.ro) return; var el = $('#f_' + c.n, v); if (el) o[c.n] = el.value; });
    if (t === 'factures' && !nouveau && ligne && String(ligne.net_ttc) === String(o.net_ttc) &&
      (String(ligne.montant_ht) !== String(o.montant_ht) || String(ligne.tva) !== String(o.tva) || String(ligne.cession_ht) !== String(o.cession_ht) || String(ligne.retenue) !== String(o.retenue))) {
      o.net_ttc = ''; // recalcul automatique du net si les montants ont changé
    }
    var b = $('#bEnr', v); b.disabled = true; b.textContent = 'Enregistrement…';
    appel('enregistrer', { table: t, ligne: o }).then(function () {
      fermer(); toast(nouveau ? 'Ajouté' : 'Modifié'); if (S.vue === t) vueTable(t); else { delete S.cache[t]; afficherVue(); }
    }).catch(function (er) { b.disabled = false; b.textContent = 'Enregistrer'; $('#fErr', v).innerHTML = '<div class="msg msg-e">' + esc(er.message) + '</div>'; });
  });
}

/* =====================================================================

var C = { token: null, ctx: null, photo: null, ticket: null, lu: '', jetons: {}, file: [], sync: false };
function cGarder(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function cLire(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function cAppel(action, params, jeton) {
  return new Promise(function (ok, ko) {
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.ok) return ok(r.data);
      var e = new Error((r && r.message) || 'Erreur'); e.code = r && r.erreur;
      ko(e);
    }).withFailureHandler(function () { var e = new Error('Pas de réseau : vérifiez la connexion et réessayez.'); e.reseau = true; ko(e); })
      .api(jeton === undefined ? C.token : jeton, action, params || {});

}
/* Appel authentifié pour un engin : reconnexion automatique avec la clé de l'appareil si la session a expiré. */
function cJeton(engin, cle, neuf) {
  if (C.jetons[engin] && !neuf) return Promise.resolve(C.jetons[engin]);
  if (!cle) { var e = new Error('Saisissez de nouveau le code de l\'engin.'); e.code = 'CLE'; return Promise.reject(e); }
  return cAppel('chauffeurReprise', { engin: engin, cle: cle }, null).then(function (r) {

}

/* --- contexte de l'engin gardé sur le téléphone, complété par les relevés en attente --- */
function cCtx(ctx) {
  if (!ctx) return;

  C.ctx = cAvecFile(ctx);
}
function cAvecFile(ctx) {
  var x = JSON.parse(JSON.stringify(ctx)), e = x.engin;
  C.file.filter(function (it) { return it.engin === e.code; }).forEach(function (it) {
    var k = Number(String(it.p.compteur).replace(',', '.'));
    if (e.compteur === '' || e.compteur == null || it.p.date > String(e.dernier) || (it.p.date === String(e.dernier) && k > Number(e.compteur))) { e.compteur = k; e.dernier = it.p.date; }
    x.releves.unshift({ date: it.p.date, compteur: k, carburant: it.p.carburant, attente: true });
  });
  x.releves.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : Number(b.compteur) - Number(a.compteur); });
  x.releves = x.releves.slice(0, 6);

}
