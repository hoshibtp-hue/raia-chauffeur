    var dernier = cLire('raia_cengin') || '';
    var opts = '<option value="">— Choisir l\'engin —</option>' + liste.map(function (e) { return '<option value="' + esc(e.code) + '" ' + (e.code === dernier ? 'selected' : '') + '>' + esc(e.code + (e.immatriculation ? ' · ' + e.immatriculation : '') + (e.type ? ' (' + e.type + ')' : '')) + '</option>'; }).join('');
    var att = C.file.length ? '<div class="ch-file"><b>⏳ ' + C.file.length + ' relevé(s) en attente d\'envoi sur ce téléphone</b>Ils seront envoyés automatiquement.</div>' : '';
    cEcran(cTete() + att + '<form id="cF" class="ch-carte">' + (msg ? '<div class="msg msg-e">' + esc(msg) + '</div>' : '') +
      '<label>Mon engin</label><select id="cE" required>' + opts + '</select>' +
      '<label>Code PIN de l\'engin</label><input id="cP" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required placeholder="••••">' +
      '<button class="ch-btn" type="submit">Entrer</button>' +
      (liste.length ? '' : '<p class="compte">Aucun engin n\'a encore de code PIN : demandez-le à la logistique.</p>') + '</form>');
    $('#cF').onsubmit = function (ev) {
      ev.preventDefault();
      var b = $('.ch-btn'), code = $('#cE').value; b.disabled = true; b.textContent = 'Vérification…';
      cAppel('chauffeurConnexion', { engin: code, pin: $('#cP').value }, null).then(function (r) {
        C.token = r.token; C.jetons[code] = r.token;
        cGarder('raia_cengin', code); cGarder('raia_ccle', r.cle);
        C.file.forEach(function (it) { if (it.engin === code) { it.cle = r.cle; if (it.etat === 'cle') it.etat = 'attente'; } });
        cGarderFile();
        cCtx(r.contexte); chauffeurSaisie(); cSynchroniser();
      }).catch(function (e) { chauffeurConnexion(e.message); });
    };
  }).catch(function (e) { cEcran(cTete() + '<div class="ch-carte"><div class="msg msg-e">' + esc(e.reseau ? 'Pas de réseau. La première connexion d\'un engin demande internet ; ensuite l\'application fonctionne aussi sans réseau.' : e.message) + '</div><button class="ch-btn" onclick="chauffeurConnexion()">Réessayer</button></div>'); });
}

function chauffeurSaisie(msgOk) {
  var x = C.ctx, e = x.engin, u = e.unite;
  C.photo = null; C.ticket = null; C.lu = ''; C.ocr = null;
  var nom = cLire('raia_cnom') || e.conducteur || '';
  var pers = (x.listes.personnel || []).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  var chs = (x.listes.chantiers || []).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  var der = e.compteur !== '' && e.compteur != null ? nb(e.compteur) + ' ' + u + ' le ' + dfr(e.dernier) : 'aucun relevé';
  var jourMax = (x.recu_le && Date.now() - x.recu_le < 6 * 3600000) || auj() < x.date ? x.date : auj(); /* date du serveur si le contexte est récent */
  var jour = jourReleve(jourMax), veille = jour < jourMax;
  cEcran(cTete(e.code + (e.immatriculation ? ' · ' + e.immatriculation : '')) +
    (msgOk ? '<div class="msg msg-i ch-ok">' + msgOk + '</div>' : '') +
    '<div id="cFile"></div>' +
    '<div class="ch-info"><div><span>Dernier compteur</span><b>' + esc(der) + '</b></div>' + (e.vidange ? '<div><span>Vidange</span><b>' + esc(e.vidange) + '</b></div>' : '') + '</div>' +
    '<form id="cS" class="ch-carte">' +
    '<label>1. Photo du compteur (tableau de bord)</label>' +
    '<label class="ch-photo" id="lPh"><input id="cPh" type="file" accept="image/*" capture="environment" hidden><span id="tPh">📷 Prendre la photo</span><img id="iPh" hidden></label>' +
    '<label class="ch-galerie"><input id="cPh2" type="file" accept="image/*" hidden>🖼 Caméra noire ou bloquée ? Choisir une photo déjà prise</label>' +
    '<div id="ocr" class="compte"></div>' +
    '<label>2. Compteur (' + u + ') <span style="font-weight:400;color:var(--gris)">– rempli d\'après la photo, sinon le bureau le lira</span></label><input id="cK" inputmode="numeric" pattern="[0-9 ]*" placeholder="Ex. ' + esc(e.compteur || '125000') + '">' +
    '<div id="cKa" class="compte"></div>' +
    '<label>Chauffeur</label><input id="cN" list="lN" value="' + esc(nom) + '" required><datalist id="lN">' + pers + '</datalist>' +
    '<label>Date du relevé' + (veille ? ' <span style="font-weight:400;color:var(--gris)">(avant midi = relevé de la veille)</span>' : '') + '</label><input id="cD" type="date" value="' + esc(jour) + '" max="' + esc(jourMax) + '">' +
    '<label>Chantier du jour</label><input id="cC" list="lC" value="' + esc(cLire('raia_cch') || '') + '"><datalist id="lC">' + chs + '</datalist>' +
    '<div class="ch-deux"><div><label>Carburant (L)</label><input id="cL" inputmode="decimal" placeholder="0"></div><div><label>Dépense (F CFA)</label><input id="cM" inputmode="numeric" placeholder="0"></div></div>' +
    '<label class="ch-photo petit" id="lTk"><input id="cTk" type="file" accept="image/*" capture="environment" hidden><span id="tTk">🧾 Photo du ticket carburant (facultatif)</span><img id="iTk" hidden></label>' +
    '<label>Commentaire</label><textarea id="cO" rows="2" placeholder="Trajet, observation…"></textarea>' +
    '<label class="ch-panne"><input type="checkbox" id="cPa"> Signaler une panne ou un problème</label>' +
    '<div id="cErr"></div><button class="ch-btn" type="submit">Envoyer le relevé</button></form>' +
    '<div class="ch-hist"><b>Derniers relevés</b>' + (x.releves.length ? x.releves.map(function (r) { return '<div' + (r.attente ? ' class="att"' : '') + '><span>' + (r.attente ? '⏳ ' : '') + dfr(r.date) + '</span><span>' + nb(r.compteur) + ' ' + u + '</span><span>' + (r.carburant ? nb(r.carburant) + ' L' : '') + '</span></div>'; }).join('') : '<div class="compte">Aucun</div>') + '</div>' +
    '<p class="ch-pied"><a href="#" id="cQ">Changer d\'engin</a></p>');
  cMajFile(); cPrechargerOCR();
  $('#cQ').onclick = function (ev) { ev.preventDefault(); C.token = null; chauffeurConnexion(); };
  $('#cK').oninput = cVerifierCompteur;
  $('#cPh2').onchange = $('#cPh').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    $('#tPh').textContent = 'Préparation de la photo…';
    cPreparerImage(f, 1400).then(function (r) {
      C.photo = r.jpeg; $('#iPh').src = r.jpeg; $('#iPh').hidden = false; $('#tPh').textContent = '📷 Reprendre la photo';
      C.ocr = cLireCompteur(r.canvas);
    }).catch(function () { $('#tPh').textContent = '📷 Prendre la photo'; toast('Photo illisible, réessayez.', true); });
  };
  $('#cTk').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    cPreparerImage(f, 1200).then(function (r) { C.ticket = r.jpeg; $('#iTk').src = r.jpeg; $('#iTk').hidden = false; $('#tTk').textContent = '🧾 Ticket ajouté (toucher pour changer)'; });
  };
  $('#cS').onsubmit = function (ev) { ev.preventDefault(); chauffeurEnvoyer(false); };
}

/* --- encadré : réseau + relevés en attente --- */
function cMajFile() {
  var z = $('#cFile'); if (!z) return;
  var hl = navigator.onLine === false, f = C.file;
  if (!f.length && !hl) { z.innerHTML = ''; return; }
  var h = '<div class="ch-file' + (f.length ? '' : ' ok') + '">';
  if (hl) h += '<b>📶 Pas de réseau – vous pouvez continuer à saisir.</b>Les relevés restent sur le téléphone et partiront tout seuls au retour du réseau.';
  if (f.length) {
    if (!hl) h += '<b>⏳ ' + f.length + ' relevé(s) en attente d\'envoi' + (C.sync ? ' – envoi en cours…' : '') + '</b>';
    h += f.map(function (it, i) {
      var t = '<div class="it">' + esc(it.engin) + ' · ' + dfr(it.p.date) + ' · ' + (String(it.p.compteur) === '' ? 'compteur sur la photo' : nb(Number(String(it.p.compteur).replace(',', '.')))) + (it.p.carburant ? ' · ' + esc(it.p.carburant) + ' L' : '') + (it.p.photo ? ' · 📷' : '');
      if (it.etat === 'attention') t += '<div class="n-a">⚠ ' + esc(it.msg) + '</div><button class="p" data-ok="' + i + '">Confirmer ce compteur</button><button data-sup="' + i + '">Supprimer</button>';
      else if (it.etat === 'erreur') t += '<div class="n-e">' + esc(it.msg) + '</div><button data-re="' + i + '">Réessayer</button><button data-sup="' + i + '">Supprimer</button>';
      else if (it.etat === 'cle') t += '<div class="n-a">Code de l\'engin changé : reconnectez-vous à ' + esc(it.engin) + ' pour envoyer.</div>';
      return t + '</div>';
    }).join('');
    if (!hl && !C.sync) h += '<div class="it"><button class="p" id="cEnv">Envoyer maintenant</button></div>';
  }
  z.innerHTML = h + '</div>';
  var b = $('#cEnv'); if (b) b.onclick = cSynchroniser;
  $$('#cFile [data-ok]').forEach(function (x) { x.onclick = function () { var it = C.file[+x.getAttribute('data-ok')]; it.p.forcer = true; it.etat = 'attente'; cGarderFile().then(cSynchroniser); }; });
  $$('#cFile [data-re]').forEach(function (x) { x.onclick = function () { C.file[+x.getAttribute('data-re')].etat = 'attente'; cGarderFile().then(cSynchroniser); }; });
  $$('#cFile [data-sup]').forEach(function (x) { x.onclick = function () { if (!confirm('Supprimer ce relevé du téléphone ? Il ne sera pas envoyé.')) return; C.file.splice(+x.getAttribute('data-sup'), 1); cGarderFile().then(function () { cRafraichirCtx(); cMajFile(); }); }; });
}
function cRafraichirCtx() { if (C.ctxServeur) C.ctx = cAvecFile(C.ctxServeur); }

/* --- envoi différé : file d'attente traitée dans l'ordre --- */
function cSynchroniser() {
  if (C.sync || navigator.onLine === false) return;
  var a = C.file.filter(function (it) { return it.etat === 'attente'; });
  if (!a.length) return;
  C.sync = true; cMajFile();
  var envoyes = 0;
  var suivant = function () {
    var it = C.file.filter(function (x) { return x.etat === 'attente'; })[0];
    if (!it) return Promise.resolve();
    return cAppelEngin(it.engin, it.cle, 'chauffeurReleve', it.p).then(function (r) {
      C.file.splice(C.file.indexOf(it), 1); envoyes++;
      if (it.engin === cLire('raia_cengin')) cCtx(r.contexte);
      return cGarderFile().then(suivant);
    }).catch(function (e) {
      if (e.reseau) return;
      if (e.code === 'DOUBLON') C.file.splice(C.file.indexOf(it), 1);
      else if (e.code === 'CONFIRMER') { it.etat = 'attention'; it.msg = e.message; }
      else if (e.code === 'CLE') { C.file.forEach(function (x) { if (x.engin === it.engin) x.etat = 'cle'; }); }
      else { it.etat = 'erreur'; it.msg = e.message; }
      return cGarderFile().then(suivant);
    });
  };
  suivant().then(function () {
    C.sync = false; cRafraichirCtx();
    if (envoyes && formulaireVierge() && $('#cS')) chauffeurSaisie('✔ ' + envoyes + ' relevé(s) en attente envoyé(s).');
    else cMajFile();
  });
}

function cVerifierCompteur() {
  var e = C.ctx.engin, v = Number(String($('#cK').value).replace(/\s/g, '')), a = $('#cKa');
  if (!v || e.compteur === '' || e.compteur == null) { a.textContent = ''; return; }
  var jours = Math.max(1, Math.round((new Date($('#cD').value || C.ctx.date) - new Date(e.dernier)) / 86400000));
  var d = v - Number(e.compteur);
  if (d < 0) a.innerHTML = '<span class="n-e">⚠ Inférieur au dernier compteur (' + nb(e.compteur) + ') : vérifiez.</span>';
  else if (d > C.ctx.saut_max * jours) a.innerHTML = '<span class="n-a">⚠ +' + nb(d) + ' ' + e.unite + ' depuis le dernier relevé : vérifiez.</span>';
  else a.innerHTML = '<span class="n-ok">+' + nb(d) + ' ' + e.unite + ' depuis le dernier relevé</span>';
}

function chauffeurEnvoyer(forcer) {
  var b = $('#cS .ch-btn'), err = $('#cErr');
  var k = String($('#cK').value).replace(/\s/g, '');
  /* La lecture automatique est encore en cours : on l'attend (15 s au plus) avant d'envoyer. */
  if (k === '' && C.photo && C.ocr && !C.ocrAttendu) {
    C.ocrAttendu = true; b.disabled = true; b.textContent = 'Lecture du compteur…';
    var fin = function () { b.disabled = false; b.textContent = 'Envoyer le relevé'; chauffeurEnvoyer(forcer); C.ocrAttendu = false; };
    Promise.race([C.ocr, new Promise(function (r) { setTimeout(r, 15000); })]).then(fin, fin);
    return;
  }
  if (k === '' && !C.photo) { err.innerHTML = '<div class="msg msg-e">Prenez la photo du compteur, ou tapez le compteur.</div>'; return; }
  if (!C.photo && !confirm('Aucune photo du compteur. Envoyer quand même ?')) return;
  if (k !== '' && !/^\d+([.,]\d+)?$/.test(k)) { err.innerHTML = '<div class="msg msg-e">Compteur : chiffres uniquement.</div>'; return; }
  var e = C.ctx.engin, engin = e.code, cle = cLire('raia_ccle');
  var maintenant = new Date(), saisi = auj() + 'T' + String(maintenant.getHours()).padStart(2, '0') + ':' + String(maintenant.getMinutes()).padStart(2, '0');
  var p = { compteur: k, compteur_lu: C.lu, date: $('#cD').value || auj(), chauffeur: $('#cN').value, chantier: $('#cC').value, carburant: $('#cL').value, depense: String($('#cM').value).replace(/\s/g, ''),
    commentaire: $('#cO').value, panne: $('#cPa').checked, photo: C.photo ? C.photo.split(',')[1] : '', photo_ticket: C.ticket ? C.ticket.split(',')[1] : '', forcer: forcer, saisi_le: saisi };
  var garder = function () { cGarder('raia_cnom', p.chauffeur); cGarder('raia_cch', p.chantier); };
  var enFile = function () {
    if (!forcer && k !== '' && e.compteur !== '' && e.compteur != null && Number(k.replace(',', '.')) < Number(e.compteur) &&
      !confirm('Le compteur (' + k + ') est inférieur au dernier relevé (' + nb(e.compteur) + '). Confirmer quand même ?')) { b.disabled = false; b.textContent = 'Envoyer le relevé'; return; }
    p.differe = true; if (k !== '' && Number(k.replace(',', '.')) < Number(e.compteur)) p.forcer = true;
    C.file.push({ engin: engin, cle: cle, p: p, etat: 'attente', cree: Date.now() });
    cGarderFile().then(function () {
      garder(); cRafraichirCtx();
      chauffeurSaisie('📶 Pas de réseau : relevé ' + (k === '' ? '(compteur sur la photo)' : 'de ' + nb(Number(k.replace(',', '.'))) + ' ' + e.unite) + ' gardé sur le téléphone. Il sera envoyé automatiquement au retour du réseau.');
    });
  };
  b.disabled = true; b.textContent = 'Envoi en cours…'; err.innerHTML = '';
  if (navigator.onLine === false) return enFile();
  cAppelEngin(engin, cle, 'chauffeurReleve', p).then(function (r) {
    garder(); cCtx(r.contexte);
    chauffeurSaisie('✔ Relevé envoyé' + (k === '' ? ' avec la photo (le bureau lira le compteur)' : ' : ' + nb(k) + ' ' + C.ctx.engin.unite) + ' le ' + dfr(p.date) + '. Merci !');
    cSynchroniser();
  }).catch(function (er) {
    b.disabled = false; b.textContent = 'Envoyer le relevé';
    if (er.reseau) return enFile();
    if (er.code === 'CONFIRMER') { if (confirm(er.message + '\n\nConfirmer quand même ce compteur ?')) chauffeurEnvoyer(true); return; }
    if (er.code === 'CLE') { cGarder('raia_ccle', null); return chauffeurConnexion(er.message); }
    err.innerHTML = '<div class="msg msg-e">' + esc(er.message) + '</div>';
  });
}

/* --- photo : réduction + lecture automatique du compteur --- */
function cPreparerImage(fichier, maxPx) {
  return new Promise(function (ok, ko) {
    var url = URL.createObjectURL(fichier), img = new Image();
    img.onload = function () {
      var r = Math.min(1, maxPx / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok({ canvas: c, jpeg: c.toDataURL('image/jpeg', 0.72) });
    };
    img.onerror = ko; img.src = url;
  });
}
function cChargerOCR() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise(function (ok, ko) {
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
}
function cContraste(src, inverser) {
  var c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  var g = c.getContext('2d'); g.drawImage(src, 0, 0);
  var d = g.getImageData(0, 0, c.width, c.height), p = d.data, i, v, min = 255, max = 0;
  for (i = 0; i < p.length; i += 4) { v = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2]; p[i] = v; if (v < min) min = v; if (v > max) max = v; }
  var e = Math.max(1, max - min);
  for (i = 0; i < p.length; i += 4) { v = (p[i] - min) * 255 / e; if (inverser) v = 255 - v; p[i] = p[i + 1] = p[i + 2] = v; }
  g.putImageData(d, 0, 0);
  return c;
}
function cCandidats(texte) {
  var res = [];
  (texte || '').replace(/[oO]/g, '0').replace(/[lI|]/g, '1').split('\n').forEach(function (ligne) {
    var g = ligne.match(/\d+/g) || [];
    for (var i = 0; i < g.length; i++) {
      var n = '';
      for (var j = i; j < Math.min(g.length, i + 8); j++) {
        n += g[j];
        if (n.length >= 3 && n.length <= 8) res.push(Number(n));
        if (n.length > 8) break;
      }
    }
  });
  return res;
}
function cChoisir(cands) {
  var e = C.ctx.engin, der = Number(e.compteur) || 0;
  if (!cands.length) return '';
  if (der) {
    var jours = Math.max(1, Math.round((new Date() - new Date(e.dernier)) / 86400000)), maxi = der + Math.max(3000, C.ctx.saut_max * jours);
    var ok = cands.filter(function (n) { return n >= der && n <= maxi; }).sort(function (a, b) { return a - b; });
    if (ok.length) return ok[0];
    var proches = cands.slice().sort(function (a, b) { return Math.abs(a - der) - Math.abs(b - der); });
    return Math.abs(proches[0] - der) < der * 0.2 ? proches[0] : '';
  }
  return cands.sort(function (a, b) { return b - a; })[0];
}
function cLireCompteur(canvas) {
  var info = $('#ocr');
  info.innerHTML = '<span class="rond-mini"></span> Lecture du compteur sur la photo…';
  /* 1) Lecture par le serveur (Google, plus fiable) si le réseau est là ; 2) sinon lecture sur le téléphone. */
  var serveur = navigator.onLine === false || !C.photo ? Promise.reject() :
    cAppelEngin(C.ctx.engin.code, cLire('raia_ccle'), 'chauffeurLirePhoto', { photo: C.photo.split(',')[1] }).then(function (r) { if (r.valeur === '' || r.valeur == null) throw new Error('vide'); return r.valeur; });
  return serveur.catch(function () { return cLireTelephone(canvas); }).then(function (v) {
    if (v === '' || v == null) { info.innerHTML = 'Chiffres non reconnus automatiquement : vous pouvez taper le compteur, ou envoyer tel quel – le bureau le lira sur la photo.'; return; }
    C.lu = String(v);
    if (!$('#cK').value) $('#cK').value = v;
    cVerifierCompteur();
    info.innerHTML = '<span class="n-ok">Lu sur la photo : <b>' + nb(v) + '</b></span> — vérifiez et corrigez si besoin.';
  }).catch(function () { info.innerHTML = 'Lecture automatique indisponible : vous pouvez taper le compteur, ou envoyer tel quel – le bureau le lira sur la photo.'; });
}
function cLireTelephone(canvas) {
  return cChargerOCR().then(function () {
    var prep = C.worker ? Promise.resolve(C.worker) : Tesseract.createWorker('eng', 1, { langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast' }).then(function (w) {
      return w.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '11' }).then(function () { C.worker = w; return w; });
    });
    var lire = function (img) { return prep.then(function (w) { return w.recognize(img); }).then(function (r) { return r.data.text; }); };
    return lire(cContraste(canvas, false)).then(function (t1) {
      var v = cChoisir(cCandidats(t1));
      if (v !== '') return v;
      return lire(cContraste(canvas, true)).then(function (t2) { return cChoisir(cCandidats(t2)); });
    });
  });
}

/* ---------- démarrage ---------- */
var MODE = 'chauffeur';
if (/^</.test(MODE)) MODE = /page=chauffeur/.test(location.search) ? 'chauffeur' : '';
(function demarrer() {
  if (MODE === 'chauffeur') return chauffeurDemarrer();
  var t = lire('raia_t');
  if (!t) return ecranConnexion();
  S.token = t;
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok && r.erreur === 'MDP') return ecranMotDePasse(true);
    if (!r.ok) return finSession(r.erreur === 'SESSION' ? 'Session expirée. Veuillez vous reconnecter.' : r.message);
    S.ctx = r.data; S.user = r.data.utilisateur; stocker('raia_u', S.user.identifiant);
    LOC.set(cleHL('contexte', {}), { le: Date.now(), data: r.data });
    coquille();
  }).withFailureHandler(function () {
    LOC.get(cleHL('contexte', {})).then(function (c) {
      if (!c) return ecranConnexion('Serveur injoignable : vérifiez la connexion internet.');
      S.ctx = c.data; S.user = c.data.utilisateur; coquille(); bandeauHL(c.le);
    });
  }).api(t, 'contexte', {});
})();
